version: '3.8'

# Observability stack for helios. Prometheus scrapes the dashboard's
# aggregated /metrics endpoint (one target covers the whole cluster).
# Grafana auto-provisions the datasource and the pre-built dashboard
# on first boot — no manual setup needed.
#
# Usage:
#   cd monitoring/
#   docker compose up -d
#   open http://localhost:3000   (admin / admin)
#
# Make sure helios is already running (./helios -dash :8080 ...) before
# starting this stack, otherwise Prometheus will log scrape errors until
# it comes up (safe to ignore — it retries automatically).

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: helios-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    # host.docker.internal lets Prometheus reach helios running on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: helios-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/helios.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
